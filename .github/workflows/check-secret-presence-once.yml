name: Verify API secret presence (no API requests)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-secret-presence-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Write booleans only, never key values
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          names = ["GEMINI_API_KEY", "GROQ_API_KEY", "JUPITER_API_KEY", "XAI_API_KEY"]
          report = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "checks": {name: bool(os.getenv(name)) for name in names},
              "note": "Presence only; keys have not been tested against providers. No trades or billed API calls.",
              "tournament_started_by_this_workflow": False,
          }
          Path("docs").mkdir(exist_ok=True)
          Path("docs/credential-status.json").write_text(json.dumps(report, indent=2) + "\n")
          print("Presence-only check complete; no key values printed.")
          PY
      - name: Commit nonsecret status report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/credential-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record API secret presence status'
            git push origin HEAD:main
          fi
