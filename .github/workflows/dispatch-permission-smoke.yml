name: Verify free GitHub Actions dispatch permissions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-permission-smoke.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prove GITHUB_TOKEN can self-dispatch with no AI or market requests
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/dispatch-permission-smoke.yml/dispatches" \
            -d '{"ref":"main"}')
          test "$status" = "204" || { echo "Dispatch permission check failed: HTTP $status"; exit 1; }
          echo "Scoped GITHUB_TOKEN dispatch accepted. No user key or AI calls."
      - name: Confirm dispatched workflow was actually queued
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Workflow dispatch reached the job. Self-dispatch works."
