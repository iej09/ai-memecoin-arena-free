name: Zero-cost paper trading tournament

# Public repository + standard GitHub-hosted Ubuntu runner: free under GitHub's
# published public-repository pricing. Schedules can run late or be skipped.
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-paper-tournament.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-arena-state
  cancel-in-progress: false

jobs:
  simulate:
    # The owner authorized launch on Nov 16; still require explicit free-tier verification.
    # Changing this workflow triggers one kickoff tick, and cron continues future ticks.
    if: ${{ vars.ARENA_FREE_TIER_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DB_PATH: state/tournament.sqlite3
      RESULTS_DIR: results
      INTERVAL_SECONDS: '900'
      DECISION_EVERY: '4'
      MAX_LLM_CALLS_PER_24H: '48'
      EAGER_X: '0'
      # THESE MUST COME FROM GITHUB SECRETS; NEVER COMMIT REAL VALUES.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main  # Always load the current saved ledger, not a queued stale SHA.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the original simulated portfolio and deadline
        run: python state_tools.py restore
      - name: Verify persisted competition clock
        run: |
          python - <<'PY'
          from tournament import Ledger, DB_PATH
          ledger = Ledger(DB_PATH)
          start = ledger.meta("started_at")
          deadline = ledger.meta("deadline")
          if start is not None and (deadline is None or
                                    abs(float(deadline) - float(start) - 604800) > 0.01):
              raise RuntimeError("Saved 7-day deadline is inconsistent; refusing to modify state")
          print("Original clock preserved:", bool(start), "iteration", ledger.meta("iteration"))
          ledger.db.close()
          PY
      - name: Free API preflight (refreshes when needed, does not start clock)
        run: python preflight.py
      - name: Run exactly one PAPER-ONLY tick
        run: python tournament.py --once
      - name: Publish a public and read-only scoreboard
        run: python static_export.py
      - name: Show paper portfolios in the GitHub Actions run
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          state = json.loads(Path("docs/data.json").read_text())
          meta = state.get("meta") or {}
          deadline = meta.get("deadline")
          deadline_text = (datetime.fromtimestamp(float(deadline), timezone.utc).isoformat()
                           if deadline else "not started")
          lines = ["## Live paper-only portfolios", "",
                   "Original deadline (UTC): **" + deadline_text + "**", "",
                   "| Bot | Virtual CAD | Exposure | Paper holdings | Last AI decision |",
                   "|---|---:|---:|---|---|"]
          for p in state.get("scoreboard", []):
              holdings = ", ".join(str(h.get("symbol", "?")) for h in p.get("holdings", [])) or "Cash"
              decision = ("API ERROR" if p.get("last_decision_health") == "API_ERROR"
                          else p.get("last_decision", "PENDING"))
              lines.append("| {} | {:.2f} | {:.1f}% | {} | {} |".format(
                  p.get("name", "?"), float(p.get("nav_cad", 0)),
                  float(p.get("exposure_pct", 0)), holdings, decision))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Save database snapshot for the next job
        run: python state_tools.py save
      - name: Commit public results and state (never secrets)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/tournament.sqlite3.gz docs/index.html docs/data.json docs/.nojekyll STATUS.md
          if [ -d docs/results ]; then git add docs/results/*.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'paper tick: update scoreboard and ledger'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        if: ${{ vars.ARENA_PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload only public website data
        if: ${{ vars.ARENA_PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1  # Minimal artifact storage on GitHub Free.
      - name: Deploy the updated scoreboard
        if: ${{ vars.ARENA_PAGES_ENABLED == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
