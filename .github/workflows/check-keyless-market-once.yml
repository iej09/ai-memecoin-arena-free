name: One-time keyless market-data connectivity check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-keyless-market-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run keyless read-only data check and save safe report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess,sys,re
          from datetime import datetime,timezone
          from pathlib import Path
          run = subprocess.run([sys.executable,"tournament.py","--check-data"],
                               text=True,capture_output=True,timeout=120)
          out=run.stdout
          discovered=re.search(r"discovered:\s*(\d+)",out)
          approved=re.search(r"passed safety filter:\s*(\d+)",out)
          report={
            "checked_at_utc":datetime.now(timezone.utc).isoformat(timespec="seconds"),
            "data_check_pass":run.returncode==0,
            "discovered_count":int(discovered.group(1)) if discovered else None,
            "eligible_count":int(approved.group(1)) if approved else None,
            "model_inference_calls":0,
            "trade_orders":0,
            "tournament_started":False,
            "note":"Only public market and currency data queried. No keys used or trading."
          }
          Path("docs").mkdir(exist_ok=True)
          Path("docs/keyless-market-status.json").write_text(json.dumps(report,indent=2)+"\n")
          print("Market-data success:",report["data_check_pass"],"eligible:",report["eligible_count"])
          PY
      - name: Commit nonsecret data connectivity summary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/keyless-market-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish free keyless market check'
            git push origin HEAD:main
          fi
